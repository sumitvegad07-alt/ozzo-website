<svg xmlns="http://www.w3.org/2000/svg" width="960" height="514" viewBox="0 0 960 514" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Where each product does its work</title><rect width="960" height="514" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="513" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Where each product does its work</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">One journey, from a stranger's enquiry to money in the bank. CRM owns the first half, SFA the second.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="282.7" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Enquiry arrives</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">A call, a WhatsApp message, a form.</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">CRM captures it so it cannot be</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">forgotten.</text></g><path d="M326.6666666666667 191.7625 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(338.7 124.2)"><rect x="0" y="0" width="282.7" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Deal is worked</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Pipeline stages, follow-up tasks,</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">the shared team inbox. Still CRM.</text></g><path d="M625.3333333333334 191.7625 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(637.3 124.2)"><rect x="0" y="0" width="282.7" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Quotation goes out</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">A branded PDF off the same customer</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">record. This is the handover point.</text></g><g transform="translate(40.0 295.3)"><rect x="0" y="0" width="282.7" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Rep visits the counter</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Attendance, then a geo-tagged visit</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">on a planned beat. SFA takes over</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">here.</text></g><path d="M326.6666666666667 362.8875 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(338.7 295.3)"><rect x="0" y="0" width="282.7" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Order taken offline</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Captured on the phone with no</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">signal, synced when the network</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">returns.</text></g><path d="M625.3333333333334 362.8875 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(637.3 295.3)"><rect x="0" y="0" width="282.7" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Payment collected</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Outstanding recalculates itself,</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">stock moves, the books stay</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">current.</text></g><text x="920" y="498" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
