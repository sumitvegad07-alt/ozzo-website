<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Both products, one customer record</title><rect width="960" height="425" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="424" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Both products, one customer record</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">This is why the choice is not a fork in the road: there is no second database to migrate into later.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="226.54000000000002" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#7834e8"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">The office side</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#7834e8">LOGGED BY CRM</text><circle cx="27" cy="78" r="3.4" fill="#7834e8"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">WhatsApp conversation from</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">the shared inbox</text><circle cx="27" cy="126.18" r="3.4" fill="#7834e8"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Enquiry, deal stage and</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">follow-up tasks</text><circle cx="27" cy="174.36" r="3.4" fill="#7834e8"/><text x="45" y="176.3" font-size="14.5" font-weight="400" fill="#171923">Quotation sent, and its</text><text x="45" y="196.8" font-size="14.5" font-weight="400" fill="#171923">version history</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="226.54000000000002" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">The field side</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">LOGGED BY SFA</text><circle cx="27" cy="78" r="3.4" fill="#00945e"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Geo-tagged visit, with</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">arrival time</text><circle cx="27" cy="126.18" r="3.4" fill="#00945e"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Order taken at the counter</text><circle cx="27" cy="155.18" r="3.4" fill="#00945e"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Payment collected and</text><text x="45" y="177.7" font-size="14.5" font-weight="400" fill="#171923">outstanding left</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="226.54000000000002" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e18600"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">What you get</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#e18600">ONE TIMELINE</text><circle cx="27" cy="78" r="9" fill="#e18600" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Office and field land on the</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">same customer</text><circle cx="27" cy="126.18" r="9" fill="#e18600" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Start with one line, add the</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">other when ready</text><circle cx="27" cy="174.36" r="9" fill="#e18600" opacity="0.14"/><path d="M23 174.86 l2.8 2.8 L31.4 170.96" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="176.3" font-size="14.5" font-weight="400" fill="#171923">No migration, no re-keying,</text><text x="45" y="196.8" font-size="14.5" font-weight="400" fill="#171923">no second login</text></g><text x="920" y="409" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
