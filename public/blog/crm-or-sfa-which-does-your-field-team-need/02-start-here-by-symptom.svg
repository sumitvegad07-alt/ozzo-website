<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Start from the symptom, not the feature list</title><rect width="960" height="530" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="529" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Start from the symptom, not the feature list</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Whichever line below sounds most like this month, that is where to begin.</text><rect x="40" y="124.19999999999999" width="880" height="60" rx="16" fill="#ffffff" stroke="#e1e0db"/><text x="60" y="150.5" font-size="15" font-weight="400" fill="#171923">Enquiries are slipping and nobody is sure whose job each one is</text><rect x="722.4" y="138.2" width="177.6" height="32" rx="16" fill="#f1eafd"/><text x="811.2" y="159.7" font-size="14.5" font-weight="700" fill="#7834e8" text-anchor="middle">Start with CRM</text><rect x="40" y="192.2" width="880" height="60" rx="2" fill="#f8f7f2" stroke="#e1e0db"/><text x="60" y="218.5" font-size="15" font-weight="400" fill="#171923">Customer history lives in a rep's personal phone, not in the business</text><rect x="722.4" y="206.2" width="177.6" height="32" rx="16" fill="#f1eafd"/><text x="811.2" y="227.7" font-size="14.5" font-weight="700" fill="#7834e8" text-anchor="middle">Start with CRM</text><rect x="40" y="260.2" width="880" height="60" rx="2" fill="#ffffff" stroke="#e1e0db"/><text x="60" y="286.5" font-size="15" font-weight="400" fill="#171923">You cannot verify which outlets were actually visited yesterday</text><rect x="670.0" y="274.2" width="230.0" height="32" rx="16" fill="#f1eafd"/><text x="785.0" y="295.7" font-size="14.5" font-weight="700" fill="#006ee1" text-anchor="middle">Start with SFA Field</text><rect x="40" y="328.2" width="880" height="60" rx="2" fill="#f8f7f2" stroke="#e1e0db"/><text x="60" y="354.5" font-size="15" font-weight="400" fill="#171923">Orders are written on paper and re-keyed by somebody at night</text><rect x="675.4" y="342.2" width="224.6" height="32" rx="16" fill="#e3f5ed"/><text x="787.7" y="363.7" font-size="14.5" font-weight="700" fill="#00945e" text-anchor="middle">Start with full SFA</text><rect x="40" y="396.2" width="880" height="60" rx="16" fill="#ffffff" stroke="#e1e0db"/><text x="60" y="422.5" font-size="15" font-weight="400" fill="#171923">Outstanding is only correct at month-end, after the accountant catches up</text><rect x="675.4" y="410.2" width="224.6" height="32" rx="16" fill="#e3f5ed"/><text x="787.7" y="431.7" font-size="14.5" font-weight="700" fill="#00945e" text-anchor="middle">Start with full SFA</text><text x="920" y="514" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
