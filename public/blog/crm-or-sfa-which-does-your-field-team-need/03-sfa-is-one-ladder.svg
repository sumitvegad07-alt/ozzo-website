<svg xmlns="http://www.w3.org/2000/svg" width="960" height="363" viewBox="0 0 960 363" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Field tracking is not a separate product</title><rect width="960" height="363" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="362" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Field tracking is not a separate product</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">It is the entry rung of SFA. You climb the same ladder instead of changing apps later.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="282.7" height="164.7" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#006ee1"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Field line — start here</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Attendance, live location,</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">geo-tagged visits. Answers one</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">question: what is actually</text><text x="16" y="140.2" font-size="13.5" font-weight="400" fill="#5b5b67">happening out there?</text></g><path d="M326.6666666666667 201.54999999999998 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(338.7 124.2)"><rect x="0" y="0" width="282.7" height="164.7" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Add the selling</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Beat routes, territories, offline</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">order capture and dispatch. The</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">visit now produces something.</text></g><path d="M625.3333333333334 201.54999999999998 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(637.3 124.2)"><rect x="0" y="0" width="282.7" height="164.7" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Full sales and distribution</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Collection, outstanding, stock, and</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">distributor / dealer / retailer</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">levels. Same system, same data.</text></g><text x="920" y="347" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
