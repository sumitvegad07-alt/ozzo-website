<svg xmlns="http://www.w3.org/2000/svg" width="960" height="492" viewBox="0 0 960 492" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The price, broken down</title><rect width="960" height="492" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="491" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">The price, broken down</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Priced per login rather than per user, because the people signing in are your customers, not your staff.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#7834e8">₹10,000</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Per year</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">For 100 distributor and dealer logins</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#00945e">₹8</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Per login, per month</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">₹10,000 ÷ 100 logins ÷ 12 months</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#006ee1">100</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Logins included</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Use as many as you need; unused seats</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">cost nothing extra</text></g><g transform="translate(40.0 279.9)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f8f7f2" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#5b5b67">18%</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">GST on top</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Stated, as everywhere else on the</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">site</text></g><g transform="translate(339.3 279.9)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#00945e">0</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Extra per-user charges</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Your own staff are already licensed</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">on your plan</text></g><g transform="translate(638.7 279.9)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdf0dc" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e18600">Add-on</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Not a standalone product</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Sits on top of any CRM or SFA plan</text></g><text x="920" y="476" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
