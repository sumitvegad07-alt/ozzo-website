<svg xmlns="http://www.w3.org/2000/svg" width="960" height="473" viewBox="0 0 960 473" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>What OZZO DMS does, and what it does not</title><rect width="960" height="473" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="472" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">What OZZO DMS does, and what it does not</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Both columns are the product as it ships today. The right-hand one is on the product page too.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="431.0" height="275.18" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">In the portal today</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">LIVE AT DMS.OZZO.CO.IN</text><circle cx="27" cy="78" r="9" fill="#00945e" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">A login for any customer at any level</text><circle cx="27" cy="107" r="9" fill="#00945e" opacity="0.14"/><path d="M23 107.5 l2.8 2.8 L31.4 103.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">Purchase orders on you, sales orders to their</text><text x="45" y="129.5" font-size="14.5" font-weight="400" fill="#171923">shops</text><circle cx="27" cy="155.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 155.68 l2.8 2.8 L31.4 151.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Their own price list and credit limit</text><circle cx="27" cy="184.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 184.68 l2.8 2.8 L31.4 180.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="186.1" font-size="14.5" font-weight="400" fill="#171923">Schemes applied automatically</text><circle cx="27" cy="213.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 213.68 l2.8 2.8 L31.4 209.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="215.1" font-size="14.5" font-weight="400" fill="#171923">Outstanding, payments and dispatch</text><circle cx="27" cy="242.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 242.68 l2.8 2.8 L31.4 238.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="244.1" font-size="14.5" font-weight="400" fill="#171923">Four reports and a filter on every column</text></g><g transform="translate(489.0 124.2)"><rect x="0" y="0" width="431.0" height="275.18" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Not built, so not sold</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#e7000b">SAY IT BEFORE THE DEMO, NOT AFTER</text><circle cx="27" cy="78" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 74.8 l6.4 6.4 M30.2 74.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Distributor godown stock</text><circle cx="27" cy="107" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 103.8 l6.4 6.4 M30.2 103.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">Auto-replenishment from reorder levels</text><circle cx="27" cy="136" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 132.8 l6.4 6.4 M30.2 132.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="137.9" font-size="14.5" font-weight="400" fill="#171923">Claims — damage, scheme, freight, rate</text><text x="45" y="158.5" font-size="14.5" font-weight="400" fill="#171923">difference</text><circle cx="27" cy="184.18" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 180.98000000000002 l6.4 6.4 M30.2 180.98000000000002 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="186.1" font-size="14.5" font-weight="400" fill="#171923">Primary-vs-secondary stock reconciliation</text><circle cx="27" cy="213.18" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 209.98000000000002 l6.4 6.4 M30.2 209.98000000000002 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="215.1" font-size="14.5" font-weight="400" fill="#171923">Delivery boys and delivery tracking</text><circle cx="27" cy="242.18" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 238.98000000000002 l6.4 6.4 M30.2 238.98000000000002 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="244.1" font-size="14.5" font-weight="400" fill="#171923">A mobile app — it is a browser portal</text></g><text x="920" y="457" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
