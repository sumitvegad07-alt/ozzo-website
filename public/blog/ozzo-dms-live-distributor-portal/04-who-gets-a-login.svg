<svg xmlns="http://www.w3.org/2000/svg" width="960" height="471" viewBox="0 0 960 471" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Who to give a login to first</title><rect width="960" height="471" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="470" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Who to give a login to first</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">You do not have to switch on the whole network. Start where the retyping is worst.</text><g transform="translate(40 124.19999999999999)"><rect x="0" y="0" width="431.0" height="272.74" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#00945e">Start with these</text><circle cx="27" cy="61.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 61.7 l2.8 2.8 L31.4 57.800000000000004" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">The distributors who order most often</text><circle cx="27" cy="91.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 91.7 l2.8 2.8 L31.4 87.8" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="93.1" font-size="14.5" font-weight="400" fill="#171923">Anyone who sends orders as a photo or a voice</text><text x="45" y="113.7" font-size="14.5" font-weight="400" fill="#171923">note</text><circle cx="27" cy="140.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 140.88 l2.8 2.8 L31.4 136.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="142.3" font-size="14.5" font-weight="400" fill="#171923">The ones who call your accounts desk about</text><text x="45" y="162.9" font-size="14.5" font-weight="400" fill="#171923">balances</text><circle cx="27" cy="189.56" r="9" fill="#00945e" opacity="0.14"/><path d="M23 190.06 l2.8 2.8 L31.4 186.16" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="191.4" font-size="14.5" font-weight="400" fill="#171923">Customers whose schemes get argued about</text><circle cx="27" cy="219.56" r="9" fill="#00945e" opacity="0.14"/><path d="M23 220.06 l2.8 2.8 L31.4 216.16" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="221.4" font-size="14.5" font-weight="400" fill="#171923">A distributor who already sells onward to many</text><text x="45" y="242.0" font-size="14.5" font-weight="400" fill="#171923">shops</text></g><g transform="translate(489 124.19999999999999)"><rect x="0" y="0" width="431.0" height="272.74" rx="18" fill="#f8f7f2" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#5b5b67">Leave these for later</text><circle cx="27" cy="61.2" r="9" fill="#5b5b67" opacity="0.14"/><path d="M23.8 58 l6.4 6.4 M30.2 58 l-6.4 6.4" fill="none" stroke="#5b5b67" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Customers who order once or twice a year</text><circle cx="27" cy="91.2" r="9" fill="#5b5b67" opacity="0.14"/><path d="M23.8 88 l6.4 6.4 M30.2 88 l-6.4 6.4" fill="none" stroke="#5b5b67" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="93.1" font-size="14.5" font-weight="400" fill="#171923">Anyone your own rep sees at the counter anyway</text><circle cx="27" cy="121.2" r="9" fill="#5b5b67" opacity="0.14"/><path d="M23.8 118 l6.4 6.4 M30.2 118 l-6.4 6.4" fill="none" stroke="#5b5b67" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="123.1" font-size="14.5" font-weight="400" fill="#171923">Shops with no reliable internet at all</text><circle cx="27" cy="151.2" r="9" fill="#5b5b67" opacity="0.14"/><path d="M23.8 148 l6.4 6.4 M30.2 148 l-6.4 6.4" fill="none" stroke="#5b5b67" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="153.1" font-size="14.5" font-weight="400" fill="#171923">Accounts you are about to stop supplying</text></g><text x="920" y="455" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
