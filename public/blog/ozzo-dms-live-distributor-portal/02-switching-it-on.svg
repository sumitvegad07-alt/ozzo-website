<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Switching it on, start to finish</title><rect width="960" height="475" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="474" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Switching it on, start to finish</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">There is no master-data project, because the masters are already in your OZZO.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">We grant the DMS add-on to your account</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">It is granted by OZZO rather than being a switch in your</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">settings, so it happens on the call.</text></g><path d="M476 181.975 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 124.2)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">You turn on DMS access for a customer</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">A toggle on any customer record — distributor, stockist</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">or dealer — then an email and a password.</text></g><g transform="translate(40.0 275.8)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">They sign in to a browser</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Nothing to install, nothing to find in a store, nothing</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">to update.</text></g><path d="M476 333.525 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 275.8)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Their first order arrives already typed</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Priced on their own list, with schemes applied and their</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">credit limit respected.</text></g><text x="920" y="459" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
