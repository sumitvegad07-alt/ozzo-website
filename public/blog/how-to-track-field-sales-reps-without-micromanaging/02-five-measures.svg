<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The five measures, on one rep's week</title><rect width="960" height="474" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="473" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">The five measures, on one rep's week</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Worked example. Every figure here falls out of the work itself — nobody types it in at night.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="120.19999999999999" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#7834e8">79%</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Coverage</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">19 of 24 planned outlets reached</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="120.19999999999999" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#00945e">20%</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Productive visit rate</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">4 orders from 19 visits</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="120.19999999999999" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#006ee1">10:05</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">First visit time</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Averaged across the week</text></g><g transform="translate(40.0 262.4)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdf0dc" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e18600">₹18,400</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Collection per beat</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Outstanding recovered on the route</text></g><g transform="translate(339.3 262.4)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#7834e8">₹3,100</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Average order value</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Per productive visit</text></g><g transform="translate(638.7 262.4)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f8f7f2" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#5b5b67">0</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Forms filled at 9pm</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">The visit, order and payment record</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">themselves</text></g><text x="920" y="458" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
