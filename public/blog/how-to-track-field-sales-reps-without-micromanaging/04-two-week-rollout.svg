<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Introducing tracking: the first two weeks</title><rect width="960" height="576" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="575" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Introducing tracking: the first two weeks</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">How you start matters more than which software you buy.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="282.7" height="164.7" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Tell the team first</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Before anything is installed. What</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">is recorded, what is not, who can</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">see it. Finding out afterwards is</text><text x="16" y="140.2" font-size="13.5" font-weight="400" fill="#5b5b67">what destroys trust.</text></g><path d="M326.6666666666667 201.54999999999998 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(338.7 124.2)"><rect x="0" y="0" width="282.7" height="164.7" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Attendance and visits only</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Day 2. Nothing else switched on.</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">Let marking a visit become a habit</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">before order capture arrives.</text></g><path d="M625.3333333333334 201.54999999999998 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(637.3 124.2)"><rect x="0" y="0" width="282.7" height="164.7" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#006ee1"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Review nobody, days 3 to 7</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Week one data is always wrong. Half</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">the beat lists are out of date and</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">everybody is still learning the</text><text x="16" y="140.2" font-size="13.5" font-weight="400" fill="#5b5b67">buttons.</text></g><g transform="translate(40.0 314.9)"><rect x="0" y="0" width="282.7" height="187.1" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#006ee1"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Fix the beat lists together</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Week 2. With the reps, not for</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">them. Coverage means nothing if the</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">plan still lists outlets that shut</text><text x="16" y="140.2" font-size="13.5" font-weight="400" fill="#5b5b67">last year.</text></g><path d="M326.6666666666667 403.45 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(338.7 314.9)"><rect x="0" y="0" width="282.7" height="187.1" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Add orders and collection</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Now a visit can be tied to what it</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">produced, so the measures start to</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">mean something.</text></g><path d="M625.3333333333334 403.45 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(637.3 314.9)"><rect x="0" y="0" width="282.7" height="187.1" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Review as a team, not one by</text><text x="16" y="81.5" font-size="16" font-weight="700" fill="#171923">one</text><text x="16" y="103.9" font-size="13.5" font-weight="400" fill="#5b5b67">End of week 2. Ask the rep with the</text><text x="16" y="123.4" font-size="13.5" font-weight="400" fill="#5b5b67">best productive rate what he does</text><text x="16" y="143.0" font-size="13.5" font-weight="400" fill="#5b5b67">differently. This meeting decides</text><text x="16" y="162.6" font-size="13.5" font-weight="400" fill="#5b5b67">tool or stick.</text></g><text x="920" y="560" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
