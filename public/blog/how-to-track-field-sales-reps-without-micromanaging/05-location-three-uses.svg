<svg xmlns="http://www.w3.org/2000/svg" width="960" height="377" viewBox="0 0 960 377" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The only three jobs location data should have</title><rect width="960" height="377" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="376" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">The only three jobs location data should have</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Each one is a specific question answered once — not a screen somebody stares at.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="178.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#7834e8"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Confirm the visit</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#7834e8">EVIDENCE, NOT A CLAIM</text><circle cx="27" cy="78" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Arrival stamped with place</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">and time</text><circle cx="27" cy="126.18" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Coverage becomes a fact, not</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">a self-report</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="178.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#006ee1"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Settle one dispute</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#006ee1">ONCE, WITH A RECORD</text><circle cx="27" cy="78" r="9" fill="#006ee1" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#006ee1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">A contested expense or</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">attendance claim</text><circle cx="27" cy="126.18" r="9" fill="#006ee1" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#006ee1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">A record ends the argument</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">in a minute</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="178.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Shorten the beat</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">A MANAGER'S JOB, NOT THE REP'S</text><circle cx="27" cy="78" r="9" fill="#00945e" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">The route crossing the same</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">road four times</text><circle cx="27" cy="126.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Badly built beats get</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">rebuilt</text></g><text x="920" y="361" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
