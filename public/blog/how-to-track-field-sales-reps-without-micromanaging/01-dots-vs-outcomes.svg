<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Two ways to watch a field day</title><rect width="960" height="464" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="463" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Two ways to watch a field day</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">The left column creates arguments. The right column creates decisions.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="431.0" height="265.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">What most teams watch</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#e7000b">PRODUCES ANXIETY, NOT DECISIONS</text><circle cx="27" cy="78" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 74.8 l6.4 6.4 M30.2 74.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">A live dot moving across a map</text><circle cx="27" cy="107" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 103.8 l6.4 6.4 M30.2 103.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">Total distance travelled that day</text><circle cx="27" cy="136" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 132.8 l6.4 6.4 M30.2 132.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="137.9" font-size="14.5" font-weight="400" fill="#171923">Minutes spent inside each outlet</text><circle cx="27" cy="165" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 161.8 l6.4 6.4 M30.2 161.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="166.9" font-size="14.5" font-weight="400" fill="#171923">Photographs sent to a WhatsApp group</text><circle cx="27" cy="194" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 190.8 l6.4 6.4 M30.2 190.8 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="195.9" font-size="14.5" font-weight="400" fill="#171923">Punch-in time to the minute</text></g><g transform="translate(489.0 124.2)"><rect x="0" y="0" width="431.0" height="265.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">What to watch instead</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">CANNOT BE FAKED, WORTH REVIEWING</text><circle cx="27" cy="78" r="9" fill="#00945e" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Coverage — outlets reached out of outlets</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">planned</text><circle cx="27" cy="126.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Productive visit rate — visits that produced an</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">order</text><circle cx="27" cy="174.36" r="9" fill="#00945e" opacity="0.14"/><path d="M23 174.86 l2.8 2.8 L31.4 170.96" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="176.3" font-size="14.5" font-weight="400" fill="#171923">First visit time — when selling actually began</text><circle cx="27" cy="203.36" r="9" fill="#00945e" opacity="0.14"/><path d="M23 203.86 l2.8 2.8 L31.4 199.96" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="205.3" font-size="14.5" font-weight="400" fill="#171923">Collection per beat — cash that came back</text><circle cx="27" cy="232.36" r="9" fill="#00945e" opacity="0.14"/><path d="M23 232.86 l2.8 2.8 L31.4 228.96" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="234.3" font-size="14.5" font-weight="400" fill="#171923">Average order value per productive visit</text></g><text x="920" y="448" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
