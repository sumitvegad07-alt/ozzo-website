<svg xmlns="http://www.w3.org/2000/svg" width="960" height="509" viewBox="0 0 960 509" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Measure these. Stop measuring those.</title><rect width="960" height="509" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="508" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Measure these. Stop measuring those.</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">The test: can the number only improve by doing the job better? If it can be gamed, it will be.</text><g transform="translate(40 124.19999999999999)"><rect x="0" y="0" width="431.0" height="311.1" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#00945e">Put these in the Friday review</text><circle cx="27" cy="61.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 61.7 l2.8 2.8 L31.4 57.800000000000004" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Coverage against the planned beat</text><circle cx="27" cy="91.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 91.7 l2.8 2.8 L31.4 87.8" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="93.1" font-size="14.5" font-weight="400" fill="#171923">Productive visits — the ones that produced an</text><text x="45" y="113.7" font-size="14.5" font-weight="400" fill="#171923">order</text><circle cx="27" cy="140.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 140.88 l2.8 2.8 L31.4 136.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="142.3" font-size="14.5" font-weight="400" fill="#171923">Time of the first visit of the day</text><circle cx="27" cy="170.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 170.88 l2.8 2.8 L31.4 166.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="172.3" font-size="14.5" font-weight="400" fill="#171923">Collection against outstanding on that route</text><circle cx="27" cy="200.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 200.88 l2.8 2.8 L31.4 196.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="202.3" font-size="14.5" font-weight="400" fill="#171923">Order value per productive visit</text></g><g transform="translate(489 124.19999999999999)"><rect x="0" y="0" width="431.0" height="311.1" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#e7000b">Leave these alone</text><circle cx="27" cy="61.2" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 58 l6.4 6.4 M30.2 58 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Continuous live location all day — nobody</text><text x="45" y="83.7" font-size="14.5" font-weight="400" fill="#171923">reviews a day of dots</text><circle cx="27" cy="110.38" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 107.17999999999999 l6.4 6.4 M30.2 107.17999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="112.3" font-size="14.5" font-weight="400" fill="#171923">Total distance travelled — rewards long routes,</text><text x="45" y="132.9" font-size="14.5" font-weight="400" fill="#171923">punishes tight ones</text><circle cx="27" cy="159.56" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 156.36 l6.4 6.4 M30.2 156.36 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="161.4" font-size="14.5" font-weight="400" fill="#171923">Minutes inside each outlet — reps will wait in</text><text x="45" y="182.0" font-size="14.5" font-weight="400" fill="#171923">doorways for the timer</text><circle cx="27" cy="208.74" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 205.54000000000002 l6.4 6.4 M30.2 205.54000000000002 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="210.6" font-size="14.5" font-weight="400" fill="#171923">App opens and screen time — measures fiddling,</text><text x="45" y="231.2" font-size="14.5" font-weight="400" fill="#171923">not selling</text><circle cx="27" cy="257.92" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 254.72000000000003 l6.4 6.4 M30.2 254.72000000000003 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="259.8" font-size="14.5" font-weight="400" fill="#171923">Photographs as proof — easy to produce,</text><text x="45" y="280.4" font-size="14.5" font-weight="400" fill="#171923">impossible to verify</text></g><text x="920" y="493" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
