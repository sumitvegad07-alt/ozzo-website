<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>One app, two stores, one account</title><rect width="960" height="415" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="414" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">One app, two stores, one account</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">OZZO SALES is live on Google Play and on the Apple App Store. Same product, same login, same data.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="431.0" height="217.18" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Android — Google Play</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">PUBLIC SINCE 27 OCTOBER 2026</text><circle cx="27" cy="78" r="9" fill="#00945e" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Free to download, no trial wall on the app</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">itself</text><circle cx="27" cy="126.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Selfie and GPS attendance, geo-tagged visits</text><circle cx="27" cy="155.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 155.68 l2.8 2.8 L31.4 151.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Offline order capture, collections and expenses</text><circle cx="27" cy="184.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 184.68 l2.8 2.8 L31.4 180.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="186.1" font-size="14.5" font-weight="400" fill="#171923">Signs in to the account your admin creates</text></g><g transform="translate(489.0 124.2)"><rect x="0" y="0" width="431.0" height="217.18" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#7834e8"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">iPhone &amp; iPad — App Store</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#7834e8">PUBLIC SINCE 10 NOVEMBER 2026</text><circle cx="27" cy="78" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Free to download, same as Android</text><circle cx="27" cy="107" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 107.5 l2.8 2.8 L31.4 103.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">Every feature above, built from the same</text><text x="45" y="129.5" font-size="14.5" font-weight="400" fill="#171923">codebase</text><circle cx="27" cy="155.18" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 155.68 l2.8 2.8 L31.4 151.78" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Needs iOS 16.4 or later</text><circle cx="27" cy="184.18" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 184.68 l2.8 2.8 L31.4 180.78" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="186.1" font-size="14.5" font-weight="400" fill="#171923">Runs on iPhone and on iPad</text></g><text x="920" y="399" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
