<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Rolling the app out to an iPhone rep</title><rect width="960" height="495" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="494" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Rolling the app out to an iPhone rep</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Nothing changes on your account. The rep installs, signs in, and their history is already there.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#5b5b67"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Admin: nothing to do</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">No migration, no new licence, no setting to switch on.</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">The user you already created works on both platforms.</text></g><path d="M476 181.975 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 124.2)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Rep: install from the App Store</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Search OZZO SALES, or open the App Store link on the</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">OZZO site. Free, 54 MB.</text></g><g transform="translate(40.0 275.8)"><rect x="0" y="0" width="432.0" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Rep: sign in</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">The same email and password as the web dashboard. Past</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">visits, customers and routes appear immediately — the</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">data lives on the account, not the handset.</text></g><path d="M476 343.3125 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 275.8)"><rect x="0" y="0" width="432.0" height="145.125" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Rep: allow location and camera</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">iOS asks once, per permission. Location is needed for</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">punch-in and geo-tagged visits; the camera for the</text><text x="16" y="120.6" font-size="13.5" font-weight="400" fill="#5b5b67">attendance selfie and payment proof.</text></g><text x="920" y="479" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
