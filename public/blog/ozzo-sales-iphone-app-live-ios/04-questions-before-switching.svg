<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Fair questions, answered straight</title><rect width="960" height="425" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="424" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Fair questions, answered straight</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">What people actually ask when a field app arrives on a second platform.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="431.0" height="226.54000000000002" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Does it cost extra?</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">NO</text><circle cx="27" cy="78" r="9" fill="#00945e" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Pricing is per user, not per platform</text><circle cx="27" cy="107" r="9" fill="#00945e" opacity="0.14"/><path d="M23 107.5 l2.8 2.8 L31.4 103.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">A rep on an iPhone costs the same as one on</text><text x="45" y="129.5" font-size="14.5" font-weight="400" fill="#171923">Android</text><circle cx="27" cy="155.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 155.68 l2.8 2.8 L31.4 151.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Both downloads are free; the subscription sits</text><text x="45" y="177.7" font-size="14.5" font-weight="400" fill="#171923">on the account</text></g><g transform="translate(489.0 124.2)"><rect x="0" y="0" width="431.0" height="226.54000000000002" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="431.0" height="4" rx="2" fill="#7834e8"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">Is the iPhone version cut down?</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#7834e8">NO — ONE CODEBASE</text><circle cx="27" cy="78" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Attendance, visits, routes, orders, collections,</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">expenses</text><circle cx="27" cy="126.18" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Full offline capture and automatic sync, same as</text><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">Android</text><circle cx="27" cy="174.36" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 174.86 l2.8 2.8 L31.4 170.96" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="176.3" font-size="14.5" font-weight="400" fill="#171923">Shipped from the same source, so features land</text><text x="45" y="196.8" font-size="14.5" font-weight="400" fill="#171923">together</text></g><text x="920" y="409" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
