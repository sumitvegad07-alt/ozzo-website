<svg xmlns="http://www.w3.org/2000/svg" width="960" height="532" viewBox="0 0 960 532" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>What a mixed-phone team used to cost you</title><rect width="960" height="532" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="531" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">What a mixed-phone team used to cost you</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Before both platforms shipped, every team with iPhone users worked around the gap. These are the</text><text x="40" y="115.3" font-size="16" font-weight="400" fill="#5b5b67">workarounds.</text><g transform="translate(40 146.6)"><rect x="0" y="0" width="431.0" height="311.1" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#e7000b">The old workarounds</text><circle cx="27" cy="61.2" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 58 l6.4 6.4 M30.2 58 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Buying a second Android handset for the one rep</text><text x="45" y="83.7" font-size="14.5" font-weight="400" fill="#171923">on an iPhone</text><circle cx="27" cy="110.38" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 107.17999999999999 l6.4 6.4 M30.2 107.17999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="112.3" font-size="14.5" font-weight="400" fill="#171923">Letting senior people off the system because</text><text x="45" y="132.9" font-size="14.5" font-weight="400" fill="#171923">they carry iPhones</text><circle cx="27" cy="159.56" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 156.36 l6.4 6.4 M30.2 156.36 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="161.4" font-size="14.5" font-weight="400" fill="#171923">Managers logging visits for reps from the web</text><text x="45" y="182.0" font-size="14.5" font-weight="400" fill="#171923">dashboard afterwards</text><circle cx="27" cy="208.74" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 205.54000000000002 l6.4 6.4 M30.2 205.54000000000002 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="210.6" font-size="14.5" font-weight="400" fill="#171923">Two sets of numbers — app-captured for some,</text><text x="45" y="231.2" font-size="14.5" font-weight="400" fill="#171923">WhatsApp for others</text><circle cx="27" cy="257.92" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 254.72000000000003 l6.4 6.4 M30.2 254.72000000000003 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="259.8" font-size="14.5" font-weight="400" fill="#171923">Shortlisting software by platform instead of by</text><text x="45" y="280.4" font-size="14.5" font-weight="400" fill="#171923">what it does</text></g><g transform="translate(489 146.6)"><rect x="0" y="0" width="431.0" height="311.1" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#00945e">What applies now</text><circle cx="27" cy="61.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 61.7 l2.8 2.8 L31.4 57.800000000000004" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Every rep installs on the phone already in their</text><text x="45" y="83.7" font-size="14.5" font-weight="400" fill="#171923">pocket</text><circle cx="27" cy="110.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 110.88 l2.8 2.8 L31.4 106.97999999999999" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="112.3" font-size="14.5" font-weight="400" fill="#171923">Senior staff are on the same system as the field</text><circle cx="27" cy="140.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 140.88 l2.8 2.8 L31.4 136.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="142.3" font-size="14.5" font-weight="400" fill="#171923">Visits, orders and attendance are captured at</text><text x="45" y="162.9" font-size="14.5" font-weight="400" fill="#171923">the source</text><circle cx="27" cy="189.56" r="9" fill="#00945e" opacity="0.14"/><path d="M23 190.06 l2.8 2.8 L31.4 186.16" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="191.4" font-size="14.5" font-weight="400" fill="#171923">One set of numbers, because everyone is on the</text><text x="45" y="212.0" font-size="14.5" font-weight="400" fill="#171923">same app</text><circle cx="27" cy="238.74" r="9" fill="#00945e" opacity="0.14"/><path d="M23 239.24 l2.8 2.8 L31.4 235.34" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="240.6" font-size="14.5" font-weight="400" fill="#171923">Choose software on capability, not on handset</text><text x="45" y="261.2" font-size="14.5" font-weight="400" fill="#171923">policy</text></g><text x="920" y="516" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
