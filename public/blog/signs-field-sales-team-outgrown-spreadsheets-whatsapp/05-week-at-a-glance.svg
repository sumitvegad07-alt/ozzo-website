<svg xmlns="http://www.w3.org/2000/svg" width="960" height="492" viewBox="0 0 960 492" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Sign five: the week, answerable in a glance</title><rect width="960" height="492" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="491" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Sign five: the week, answerable in a glance</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Worked example of the questions that should take seconds rather than an afternoon of copy-pasting.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#7834e8">95</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Visits this week</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Across five beats, every one</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">geo-tagged</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#00945e">23</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Productive visits</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Visits that produced an order</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdf0dc" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e18600">₹2.4L</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Collected</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Against outstanding, by rep and by</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">route</text></g><g transform="translate(40.0 279.9)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#006ee1">79%</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Coverage</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Planned outlets actually reached</text></g><g transform="translate(339.3 279.9)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e7000b">2</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Reps behind plan</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Visible on Monday, not at month-end</text></g><g transform="translate(638.7 279.9)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f8f7f2" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#5b5b67">0</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Sheets to merge</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">The report builds itself as the day</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">happens</text></g><text x="920" y="476" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
