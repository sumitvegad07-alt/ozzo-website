<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Sign two: the quiet coverage leak</title><rect width="960" height="500" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="499" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Sign two: the quiet coverage leak</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Worked example — four beats, same rep, planned 24 outlets each. The spreadsheet showed all four as done.</text><text x="40" y="138.1" font-size="14.5" font-weight="600" fill="#171923">Monday beat</text><rect x="260" y="128.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="128.2" width="520.7" height="26" rx="13" fill="#00945e"/><text x="842" y="147.2" font-size="16" font-weight="700" fill="#00945e">22 of 24</text><text x="40" y="184.1" font-size="14.5" font-weight="600" fill="#171923">Tuesday beat</text><rect x="260" y="174.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="174.2" width="497.0" height="26" rx="13" fill="#00945e"/><text x="842" y="193.2" font-size="16" font-weight="700" fill="#00945e">21 of 24</text><text x="40" y="230.1" font-size="14.5" font-weight="600" fill="#171923">Wednesday beat</text><rect x="260" y="220.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="220.2" width="449.7" height="26" rx="13" fill="#e18600"/><text x="842" y="239.2" font-size="16" font-weight="700" fill="#e18600">19 of 24</text><text x="40" y="276.1" font-size="14.5" font-weight="600" fill="#171923">Thursday beat — hard</text><text x="40" y="296.4" font-size="14.5" font-weight="600" fill="#171923">parking, one argumentative</text><text x="40" y="316.7" font-size="14.5" font-weight="600" fill="#171923">shop</text><rect x="260" y="266.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="266.2" width="307.7" height="26" rx="13" fill="#e7000b"/><text x="842" y="285.2" font-size="16" font-weight="700" fill="#e7000b">13 of 24</text><text x="40" y="349.0" font-size="14.5" font-weight="600" fill="#171923">Friday beat</text><rect x="260" y="339.09999999999997" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="339.09999999999997" width="473.3" height="26" rx="13" fill="#00945e"/><text x="842" y="358.09999999999997" font-size="16" font-weight="700" fill="#00945e">20 of 24</text><text x="40" y="398.6" font-size="14" font-weight="400" fill="#5b5b67">The Thursday beat is where sales dip two months later. In a spreadsheet nothing marks it; the outlets simply stop</text><text x="40" y="418.2" font-size="14" font-weight="400" fill="#5b5b67">appearing.</text><text x="920" y="484" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
