<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Reported at night, or reporting itself?</title><rect width="960" height="490" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="489" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Reported at night, or reporting itself?</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Sign one, side by side. The difference is whether you manage a story or a day.</text><g transform="translate(40 124.19999999999999)"><rect x="0" y="0" width="431.0" height="291.92" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#e7000b">The 8pm WhatsApp round-up</text><circle cx="27" cy="61.2" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 58 l6.4 6.4 M30.2 58 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">A list of shops visited that nobody can check</text><circle cx="27" cy="91.2" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 88 l6.4 6.4 M30.2 88 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="93.1" font-size="14.5" font-weight="400" fill="#171923">“Reached the customer” typed from memory, hours</text><text x="45" y="113.7" font-size="14.5" font-weight="400" fill="#171923">later</text><circle cx="27" cy="140.38" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 137.18 l6.4 6.4 M30.2 137.18 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="142.3" font-size="14.5" font-weight="400" fill="#171923">Skipped outlets simply never get mentioned</text><circle cx="27" cy="170.38" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 167.18 l6.4 6.4 M30.2 167.18 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="172.3" font-size="14.5" font-weight="400" fill="#171923">You reconstruct the day instead of watching it</text><circle cx="27" cy="200.38" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 197.18 l6.4 6.4 M30.2 197.18 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="202.3" font-size="14.5" font-weight="400" fill="#171923">Reports take an afternoon of copy-pasting</text></g><g transform="translate(489 124.19999999999999)"><rect x="0" y="0" width="431.0" height="291.92" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#00945e">A day that records itself</text><circle cx="27" cy="61.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 61.7 l2.8 2.8 L31.4 57.800000000000004" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Selfie-and-GPS attendance at the start of the</text><text x="45" y="83.7" font-size="14.5" font-weight="400" fill="#171923">day</text><circle cx="27" cy="110.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 110.88 l2.8 2.8 L31.4 106.97999999999999" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="112.3" font-size="14.5" font-weight="400" fill="#171923">Each visit geo-tagged on arrival, with the time</text><circle cx="27" cy="140.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 140.88 l2.8 2.8 L31.4 136.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="142.3" font-size="14.5" font-weight="400" fill="#171923">A skip needs a reason, so the pattern becomes</text><text x="45" y="162.9" font-size="14.5" font-weight="400" fill="#171923">visible</text><circle cx="27" cy="189.56" r="9" fill="#00945e" opacity="0.14"/><path d="M23 190.06 l2.8 2.8 L31.4 186.16" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="191.4" font-size="14.5" font-weight="400" fill="#171923">A live feed you glance at, not a story you</text><text x="45" y="212.0" font-size="14.5" font-weight="400" fill="#171923">assemble</text><circle cx="27" cy="238.74" r="9" fill="#00945e" opacity="0.14"/><path d="M23 239.24 l2.8 2.8 L31.4 235.34" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="240.6" font-size="14.5" font-weight="400" fill="#171923">The per-rep daily summary builds itself as it</text><text x="45" y="261.2" font-size="14.5" font-weight="400" fill="#171923">happens</text></g><text x="920" y="474" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
