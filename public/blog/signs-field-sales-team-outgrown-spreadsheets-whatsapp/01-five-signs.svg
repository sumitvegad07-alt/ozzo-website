<svg xmlns="http://www.w3.org/2000/svg" width="960" height="572" viewBox="0 0 960 572" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Five signs you have outgrown the spreadsheet</title><rect width="960" height="572" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="571" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Five signs you have outgrown the spreadsheet</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">None of these fail loudly. They leak quietly, and you feel it a month later.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="156.78" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">1. The day is reported</text><text x="18" y="58.2" font-size="19" font-weight="700" fill="#171923">at night</text><text x="18" y="78.2" font-size="11" font-weight="700" fill="#e7000b">FROM MEMORY, UNVERIFIABLE</text><circle cx="27" cy="104.6" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 101.39999999999999 l6.4 6.4 M30.2 101.39999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="106.5" font-size="14.5" font-weight="400" fill="#171923">A WhatsApp round-up after</text><text x="45" y="127.1" font-size="14.5" font-weight="400" fill="#171923">8pm is a story, not a day</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="156.78" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">2. The same outlets</text><text x="18" y="58.2" font-size="19" font-weight="700" fill="#171923">get skipped</text><text x="18" y="78.2" font-size="11" font-weight="700" fill="#e7000b">AND YOU NEVER SEE THE PATTERN</text><circle cx="27" cy="104.6" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 101.39999999999999 l6.4 6.4 M30.2 101.39999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="106.5" font-size="14.5" font-weight="400" fill="#171923">A beat plan in a spreadsheet</text><text x="45" y="127.1" font-size="14.5" font-weight="400" fill="#171923">is only a suggestion</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="156.78" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">3. Outstanding lives</text><text x="18" y="58.2" font-size="19" font-weight="700" fill="#171923">in a head</text><text x="18" y="78.2" font-size="11" font-weight="700" fill="#e7000b">UPDATED AT MONTH-END, IF AT ALL</text><circle cx="27" cy="104.6" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 101.39999999999999 l6.4 6.4 M30.2 101.39999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="106.5" font-size="14.5" font-weight="400" fill="#171923">You sell to shops that</text><text x="45" y="127.1" font-size="14.5" font-weight="400" fill="#171923">already owe you</text></g><g transform="translate(40.0 299.0)"><rect x="0" y="0" width="281.3" height="198.95" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">4. Knowledge leaves</text><text x="18" y="58.2" font-size="19" font-weight="700" fill="#171923">with the rep</text><text x="18" y="78.2" font-size="11" font-weight="700" fill="#e7000b">THE DATABASE BELONGS TO THEM</text><circle cx="27" cy="104.6" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 101.39999999999999 l6.4 6.4 M30.2 101.39999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="106.5" font-size="14.5" font-weight="400" fill="#171923">History in a personal phone</text><text x="45" y="127.1" font-size="14.5" font-weight="400" fill="#171923">is not your data</text></g><g transform="translate(339.3 299.0)"><rect x="0" y="0" width="281.3" height="198.95" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e7000b"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">5. No numbers for last</text><text x="18" y="58.2" font-size="19" font-weight="700" fill="#171923">week</text><text x="18" y="78.2" font-size="11" font-weight="700" fill="#e7000b">AN AFTERNOON OF COPY-PASTING</text><circle cx="27" cy="104.6" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 101.39999999999999 l6.4 6.4 M30.2 101.39999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="106.5" font-size="14.5" font-weight="400" fill="#171923">You are managing on hunches,</text><text x="45" y="127.1" font-size="14.5" font-weight="400" fill="#171923">and growth makes it worse</text></g><g transform="translate(638.7 299.0)"><rect x="0" y="0" width="281.3" height="198.95" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#e18600"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">The common thread</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#e18600">WHAT IT ACTUALLY COSTS</text><circle cx="27" cy="78" r="3.4" fill="#e18600"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Orders lost, coverage</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">slipping, cash collected</text><text x="45" y="121.1" font-size="14.5" font-weight="400" fill="#171923">late</text><circle cx="27" cy="146.76999999999998" r="3.4" fill="#e18600"/><text x="45" y="148.7" font-size="14.5" font-weight="400" fill="#171923">Felt a month after it</text><text x="45" y="169.2" font-size="14.5" font-weight="400" fill="#171923">happened</text></g><text x="920" y="556" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
