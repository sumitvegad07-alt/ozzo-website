<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>CRM, SFA, DMS — the difference is who logs in</title><rect width="960" height="435" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="434" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">CRM, SFA, DMS — the difference is who logs in</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">These three get used interchangeably in sales calls. They manage three different sets of people.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="281.3" height="236.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#7834e8"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">CRM</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#7834e8">YOUR TEAM, CHASING BUSINESS</text><circle cx="27" cy="78" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Leads, deals and pipelines</text><circle cx="27" cy="107" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 107.5 l2.8 2.8 L31.4 103.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">Quotations and follow-ups</text><circle cx="27" cy="136" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 136.5 l2.8 2.8 L31.4 132.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="137.9" font-size="14.5" font-weight="400" fill="#171923">Users: your own salespeople</text><circle cx="27" cy="165" r="9" fill="#7834e8" opacity="0.14"/><path d="M23 165.5 l2.8 2.8 L31.4 161.6" fill="none" stroke="#7834e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="166.9" font-size="14.5" font-weight="400" fill="#171923">About business not yet won</text></g><g transform="translate(339.3 124.2)"><rect x="0" y="0" width="281.3" height="236.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#00945e"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">SFA</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#00945e">YOUR STAFF, IN THE FIELD</text><circle cx="27" cy="78" r="9" fill="#00945e" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Attendance, GPS and visits</text><circle cx="27" cy="107" r="9" fill="#00945e" opacity="0.14"/><path d="M23 107.5 l2.8 2.8 L31.4 103.6" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="108.9" font-size="14.5" font-weight="400" fill="#171923">Beat routes and order</text><text x="45" y="129.5" font-size="14.5" font-weight="400" fill="#171923">capture</text><circle cx="27" cy="155.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 155.68 l2.8 2.8 L31.4 151.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Users: your own reps</text><circle cx="27" cy="184.18" r="9" fill="#00945e" opacity="0.14"/><path d="M23 184.68 l2.8 2.8 L31.4 180.78" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="186.1" font-size="14.5" font-weight="400" fill="#171923">About your team's day</text></g><g transform="translate(638.7 124.2)"><rect x="0" y="0" width="281.3" height="236.36" rx="18" fill="#ffffff" stroke="#e1e0db"/><rect x="0" y="0" width="281.3" height="4" rx="2" fill="#006ee1"/><text x="18" y="31.6" font-size="19" font-weight="700" fill="#171923">DMS</text><text x="18" y="51.6" font-size="11" font-weight="700" fill="#006ee1">YOUR CUSTOMERS, ORDERING</text><circle cx="27" cy="78" r="9" fill="#006ee1" opacity="0.14"/><path d="M23 78.5 l2.8 2.8 L31.4 74.6" fill="none" stroke="#006ee1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="79.9" font-size="14.5" font-weight="400" fill="#171923">Trade logins and</text><text x="45" y="100.5" font-size="14.5" font-weight="400" fill="#171923">self-ordering</text><circle cx="27" cy="126.18" r="9" fill="#006ee1" opacity="0.14"/><path d="M23 126.68 l2.8 2.8 L31.4 122.78" fill="none" stroke="#006ee1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="128.1" font-size="14.5" font-weight="400" fill="#171923">Per-customer price lists</text><circle cx="27" cy="155.18" r="9" fill="#006ee1" opacity="0.14"/><path d="M23 155.68 l2.8 2.8 L31.4 151.78" fill="none" stroke="#006ee1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="157.1" font-size="14.5" font-weight="400" fill="#171923">Users: distributors and</text><text x="45" y="177.7" font-size="14.5" font-weight="400" fill="#171923">dealers</text><circle cx="27" cy="203.36" r="9" fill="#006ee1" opacity="0.14"/><path d="M23 203.86 l2.8 2.8 L31.4 199.96" fill="none" stroke="#006ee1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="205.3" font-size="14.5" font-weight="400" fill="#171923">About the channel in between</text></g><text x="920" y="419" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
