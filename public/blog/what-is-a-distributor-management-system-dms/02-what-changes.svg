<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>What changes when the distributor orders themselves</title><rect width="960" height="520" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="519" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">What changes when the distributor orders themselves</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">The same order, placed by the person who wants the stock instead of relayed through your desk.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="432.0" height="147.95" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">The distributor opens the portal and builds</text><text x="16" y="81.5" font-size="16" font-weight="700" fill="#171923">the order</text><text x="16" y="103.9" font-size="13.5" font-weight="400" fill="#5b5b67">From your catalogue, on their own price list, with their</text><text x="16" y="123.4" font-size="13.5" font-weight="400" fill="#5b5b67">credit limit already applied.</text></g><path d="M476 193.17499999999998 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 124.2)"><rect x="0" y="0" width="432.0" height="147.95" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#00945e"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Schemes are detected as the order is built</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Nothing claimed by hand, so nothing is missed by hand</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">and nothing is argued about later.</text></g><g transform="translate(40.0 298.1)"><rect x="0" y="0" width="432.0" height="147.95" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#7834e8"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">It lands in your system as a real order</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Already typed, by them. Nobody on your payroll reads a</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">photograph of a list.</text></g><path d="M476 367.125 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 298.1)"><rect x="0" y="0" width="432.0" height="147.95" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#006ee1"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">They check their own balance whenever they</text><text x="16" y="81.5" font-size="16" font-weight="700" fill="#171923">like</text><text x="16" y="103.9" font-size="13.5" font-weight="400" fill="#5b5b67">The “how much do I owe you” call stops arriving at your</text><text x="16" y="123.4" font-size="13.5" font-weight="400" fill="#5b5b67">accounts desk.</text></g><text x="920" y="504" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
