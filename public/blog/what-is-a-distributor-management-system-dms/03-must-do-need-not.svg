<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>What a DMS must do, and what it need not</title><rect width="960" height="480" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="479" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">What a DMS must do, and what it need not</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">The first column is what makes it a DMS rather than an order form. The second is the expensive half — buy</text><text x="40" y="115.3" font-size="16" font-weight="400" fill="#5b5b67">it only if you need it.</text><g transform="translate(40 146.6)"><rect x="0" y="0" width="431.0" height="259.58000000000004" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#00945e">The minimum that makes it a DMS</text><circle cx="27" cy="61.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 61.7 l2.8 2.8 L31.4 57.800000000000004" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">A trade customer places their own order, unaided</text><circle cx="27" cy="91.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 91.7 l2.8 2.8 L31.4 87.8" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="93.1" font-size="14.5" font-weight="400" fill="#171923">That order is priced correctly for that customer</text><circle cx="27" cy="121.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 121.7 l2.8 2.8 L31.4 117.8" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="123.1" font-size="14.5" font-weight="400" fill="#171923">Their credit limit is enforced, not advisory</text><circle cx="27" cy="151.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 151.7 l2.8 2.8 L31.4 147.79999999999998" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="153.1" font-size="14.5" font-weight="400" fill="#171923">They can see their own outstanding without a</text><text x="45" y="173.7" font-size="14.5" font-weight="400" fill="#171923">phone call</text><circle cx="27" cy="200.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 200.88 l2.8 2.8 L31.4 196.98" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="202.3" font-size="14.5" font-weight="400" fill="#171923">The result lands as data, not as something to</text><text x="45" y="222.9" font-size="14.5" font-weight="400" fill="#171923">re-enter</text></g><g transform="translate(489 146.6)"><rect x="0" y="0" width="431.0" height="259.58000000000004" rx="18" fill="#fdf0dc" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#e18600">The expensive half — decide before the</text><text x="18" y="56.0" font-size="18" font-weight="700" fill="#e18600">demo</text><circle cx="27" cy="86.4" r="9" fill="#e18600" opacity="0.14"/><path d="M23.8 83.2 l6.4 6.4 M30.2 83.2 l-6.4 6.4" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="88.3" font-size="14.5" font-weight="400" fill="#171923">Distributor godown stock held in the system</text><circle cx="27" cy="116.4" r="9" fill="#e18600" opacity="0.14"/><path d="M23.8 113.2 l6.4 6.4 M30.2 113.2 l-6.4 6.4" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="118.3" font-size="14.5" font-weight="400" fill="#171923">Auto-replenishment from reorder levels</text><circle cx="27" cy="146.4" r="9" fill="#e18600" opacity="0.14"/><path d="M23.8 143.20000000000002 l6.4 6.4 M30.2 143.20000000000002 l-6.4 6.4" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="148.3" font-size="14.5" font-weight="400" fill="#171923">Claims — damage, scheme, freight, rate</text><text x="45" y="168.9" font-size="14.5" font-weight="400" fill="#171923">difference</text><circle cx="27" cy="195.58" r="9" fill="#e18600" opacity="0.14"/><path d="M23.8 192.38000000000002 l6.4 6.4 M30.2 192.38000000000002 l-6.4 6.4" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="197.5" font-size="14.5" font-weight="400" fill="#171923">Primary-versus-secondary stock reconciliation</text><circle cx="27" cy="225.58" r="9" fill="#e18600" opacity="0.14"/><path d="M23.8 222.38000000000002 l6.4 6.4 M30.2 222.38000000000002 l-6.4 6.4" fill="none" stroke="#e18600" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="227.5" font-size="14.5" font-weight="400" fill="#171923">Van sales and delivery tracking</text></g><text x="920" y="464" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
