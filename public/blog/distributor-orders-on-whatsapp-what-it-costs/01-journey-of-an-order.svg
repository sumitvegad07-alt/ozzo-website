<svg xmlns="http://www.w3.org/2000/svg" width="960" height="801" viewBox="0 0 960 801" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The journey of one WhatsApp order</title><rect width="960" height="801" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="800" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">The journey of one WhatsApp order</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Seven steps, five of them done by someone you pay, before a single case moves.</text><g transform="translate(40.0 124.2)"><rect x="0" y="0" width="432.0" height="147.95" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#e18600"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">The distributor sends a photo of a</text><text x="16" y="81.5" font-size="16" font-weight="700" fill="#171923">handwritten list</text><text x="16" y="103.9" font-size="13.5" font-weight="400" fill="#5b5b67">At 9pm, to one person's phone, in that person's chat</text><text x="16" y="123.4" font-size="13.5" font-weight="400" fill="#5b5b67">history.</text></g><path d="M476 193.17499999999998 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 124.2)"><rect x="0" y="0" width="432.0" height="147.95" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#e7000b"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Somebody on your desk reads it the next</text><text x="16" y="81.5" font-size="16" font-weight="700" fill="#171923">morning</text><text x="16" y="103.9" font-size="13.5" font-weight="400" fill="#5b5b67">Interpreting handwriting, short names and quantities in</text><text x="16" y="123.4" font-size="13.5" font-weight="400" fill="#5b5b67">cases or pieces.</text></g><g transform="translate(40.0 298.1)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#e7000b"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">They type it into the system</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Eleven lines, matched by hand to SKUs. This is where the</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">wrong item enters.</text></g><path d="M476 355.92499999999995 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 298.1)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#e7000b"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">They look up the right rate for that customer</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">From whichever copy of the price list they opened.</text></g><g transform="translate(40.0 449.7)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#e7000b"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">They check whether a scheme applies</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">From memory, or from a circular. The missed ones become</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">credit notes later.</text></g><path d="M476 507.475 l5 5 l-5 5" fill="none" stroke="#5b5b67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><g transform="translate(488.0 449.7)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#e18600"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">They check the outstanding and credit limit</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">Another report, another lookup, before the order can be</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">released.</text></g><g transform="translate(40.0 601.3)"><rect x="0" y="0" width="432.0" height="125.55000000000001" rx="16" fill="#ffffff" stroke="#e1e0db"/><circle cx="18" cy="20" r="15" fill="#5b5b67"/><text x="18" y="25.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="16" y="59.1" font-size="16" font-weight="700" fill="#171923">Only now does the order exist</text><text x="16" y="81.5" font-size="13.5" font-weight="400" fill="#5b5b67">A day later than the distributor thinks it did, and</text><text x="16" y="101.0" font-size="13.5" font-weight="400" fill="#5b5b67">nobody can see where it waited.</text></g><text x="920" y="785" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
