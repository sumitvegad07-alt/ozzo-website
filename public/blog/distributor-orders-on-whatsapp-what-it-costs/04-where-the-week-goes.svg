<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Where one order desk's week goes</title><rect width="960" height="460" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="459" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">Where one order desk's week goes</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">Worked example — hours in a 40-hour week for a desk handling about 30 trade orders.</text><text x="40" y="138.1" font-size="14.5" font-weight="600" fill="#171923">Reading and keying orders</text><rect x="260" y="128.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="128.2" width="486.9" height="26" rx="13" fill="#e7000b"/><text x="842" y="147.2" font-size="16" font-weight="700" fill="#e7000b">12 hrs</text><text x="40" y="184.1" font-size="14.5" font-weight="600" fill="#171923">Rate and scheme lookups</text><rect x="260" y="174.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="174.2" width="284.0" height="26" rx="13" fill="#e7000b"/><text x="842" y="193.2" font-size="16" font-weight="700" fill="#e7000b">7 hrs</text><text x="40" y="230.1" font-size="14.5" font-weight="600" fill="#171923">Answering “what do I owe</text><text x="40" y="250.4" font-size="14.5" font-weight="600" fill="#171923">you?”</text><rect x="260" y="220.2" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="220.2" width="202.9" height="26" rx="13" fill="#e18600"/><text x="842" y="239.2" font-size="16" font-weight="700" fill="#e18600">5 hrs</text><text x="40" y="282.7" font-size="14.5" font-weight="600" fill="#171923">Chasing collections</text><rect x="260" y="272.79999999999995" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="272.79999999999995" width="365.1" height="26" rx="13" fill="#00945e"/><text x="842" y="291.79999999999995" font-size="16" font-weight="700" fill="#00945e">9 hrs</text><text x="40" y="328.7" font-size="14.5" font-weight="600" fill="#171923">Actually serving customers</text><rect x="260" y="318.79999999999995" width="568" height="26" rx="13" fill="#f8f7f2"/><rect x="260" y="318.79999999999995" width="284.0" height="26" rx="13" fill="#00945e"/><text x="842" y="337.79999999999995" font-size="16" font-weight="700" fill="#00945e">7 hrs</text><text x="40" y="378.3" font-size="14" font-weight="400" fill="#5b5b67">The first three bars are the work a portal removes. The last two are the work you actually want that desk doing.</text><text x="920" y="444" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
