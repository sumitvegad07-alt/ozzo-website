<svg xmlns="http://www.w3.org/2000/svg" width="960" height="514" viewBox="0 0 960 514" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>What it costs one order desk in a month</title><rect width="960" height="514" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="513" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">What it costs one order desk in a month</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">A worked example, not a survey: 60 trade customers ordering roughly twice a month. Put your own numbers</text><text x="40" y="115.3" font-size="16" font-weight="400" fill="#5b5b67">in the same shape.</text><g transform="translate(40.0 146.6)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f1eafd" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#7834e8">120</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Orders typed by hand</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">60 customers, about twice a month</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">each</text></g><g transform="translate(339.3 146.6)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdf0dc" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e18600">12 min</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Per order, start to finish</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Reading, keying, rate lookup, scheme</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">check</text></g><g transform="translate(638.7 146.6)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e7000b">24 hrs</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">A month of keying</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Three working days doing data entry</text></g><g transform="translate(40.0 302.3)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdf0dc" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e18600">1 day</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Typical order delay</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">The queue your customer cannot see</text></g><g transform="translate(339.3 302.3)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#e7000b">2–5%</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Orders needing a correction</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">Wrong SKU, wrong rate or a missed</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">scheme</text></g><g transform="translate(638.7 302.3)"><rect x="0" y="0" width="281.3" height="137.7" rx="18" fill="#f8f7f2" stroke="#e1e0db"/><text x="18" y="45.9" font-size="34" font-weight="800" fill="#5b5b67">0</text><text x="18" y="72.6" font-size="14" font-weight="400" fill="#171923">Of this adds value</text><text x="18" y="94.9" font-size="12.5" font-weight="400" fill="#5b5b67">The distributor already decided what</text><text x="18" y="112.4" font-size="12.5" font-weight="400" fill="#5b5b67">to buy</text></g><text x="920" y="498" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
