<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The costs that never appear on an invoice</title><rect width="960" height="558" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="557" rx="21.5" fill="none" stroke="#e1e0db"/><rect x="40" y="18" width="46" height="5" rx="2.5" fill="#7834e8"/><text x="40" y="58.1" font-size="27" font-weight="700" fill="#171923">The costs that never appear on an invoice</text><text x="40" y="92.9" font-size="16" font-weight="400" fill="#5b5b67">The keying time is the one people count. These are the ones that actually hurt.</text><g transform="translate(40 124.19999999999999)"><rect x="0" y="0" width="431.0" height="360.28000000000003" rx="18" fill="#fdeaea" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#e7000b">What the habit really costs you</text><circle cx="27" cy="61.2" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 58 l6.4 6.4 M30.2 58 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">Orders sitting in one person's chat while they</text><text x="45" y="83.7" font-size="14.5" font-weight="400" fill="#171923">are on leave</text><circle cx="27" cy="110.38" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 107.17999999999999 l6.4 6.4 M30.2 107.17999999999999 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="112.3" font-size="14.5" font-weight="400" fill="#171923">A missed scheme becoming a credit note and an</text><text x="45" y="132.9" font-size="14.5" font-weight="400" fill="#171923">awkward call</text><circle cx="27" cy="159.56" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 156.36 l6.4 6.4 M30.2 156.36 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="161.4" font-size="14.5" font-weight="400" fill="#171923">Your accounts desk reading balances out over the</text><text x="45" y="182.0" font-size="14.5" font-weight="400" fill="#171923">phone</text><circle cx="27" cy="208.74" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 205.54000000000002 l6.4 6.4 M30.2 205.54000000000002 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="210.6" font-size="14.5" font-weight="400" fill="#171923">Secondary sales arriving late, in a format</text><text x="45" y="231.2" font-size="14.5" font-weight="400" fill="#171923">nobody can total</text><circle cx="27" cy="257.92" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 254.72000000000003 l6.4 6.4 M30.2 254.72000000000003 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="259.8" font-size="14.5" font-weight="400" fill="#171923">No record of why an order waited, so nobody can</text><text x="45" y="280.4" font-size="14.5" font-weight="400" fill="#171923">fix it</text><circle cx="27" cy="307.1" r="9" fill="#e7000b" opacity="0.14"/><path d="M23.8 303.90000000000003 l6.4 6.4 M30.2 303.90000000000003 l-6.4 6.4" fill="none" stroke="#e7000b" stroke-width="2.2" stroke-linecap="round"/><text x="45" y="309.0" font-size="14.5" font-weight="400" fill="#171923">Your lead time containing a queue you never</text><text x="45" y="329.6" font-size="14.5" font-weight="400" fill="#171923">measure</text></g><g transform="translate(489 124.19999999999999)"><rect x="0" y="0" width="431.0" height="360.28000000000003" rx="18" fill="#e3f5ed" stroke="#e1e0db"/><text x="18" y="30.8" font-size="18" font-weight="700" fill="#00945e">What a portal removes on day one</text><circle cx="27" cy="61.2" r="9" fill="#00945e" opacity="0.14"/><path d="M23 61.7 l2.8 2.8 L31.4 57.800000000000004" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="63.1" font-size="14.5" font-weight="400" fill="#171923">The retyping, entirely — the buyer types their</text><text x="45" y="83.7" font-size="14.5" font-weight="400" fill="#171923">own order</text><circle cx="27" cy="110.38" r="9" fill="#00945e" opacity="0.14"/><path d="M23 110.88 l2.8 2.8 L31.4 106.97999999999999" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="112.3" font-size="14.5" font-weight="400" fill="#171923">The rate lookup, because pricing follows the</text><text x="45" y="132.9" font-size="14.5" font-weight="400" fill="#171923">customer</text><circle cx="27" cy="159.56" r="9" fill="#00945e" opacity="0.14"/><path d="M23 160.06 l2.8 2.8 L31.4 156.16" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="161.4" font-size="14.5" font-weight="400" fill="#171923">The scheme argument, because detection is</text><text x="45" y="182.0" font-size="14.5" font-weight="400" fill="#171923">automatic</text><circle cx="27" cy="208.74" r="9" fill="#00945e" opacity="0.14"/><path d="M23 209.24 l2.8 2.8 L31.4 205.34" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="210.6" font-size="14.5" font-weight="400" fill="#171923">The balance call, because they can see it</text><text x="45" y="231.2" font-size="14.5" font-weight="400" fill="#171923">themselves</text><circle cx="27" cy="257.92" r="9" fill="#00945e" opacity="0.14"/><path d="M23 258.42 l2.8 2.8 L31.4 254.52" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="259.8" font-size="14.5" font-weight="400" fill="#171923">The invisible queue, because the order exists</text><text x="45" y="280.4" font-size="14.5" font-weight="400" fill="#171923">when it is placed</text><circle cx="27" cy="307.1" r="9" fill="#00945e" opacity="0.14"/><path d="M23 307.6 l2.8 2.8 L31.4 303.70000000000005" fill="none" stroke="#00945e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="309.0" font-size="14.5" font-weight="400" fill="#171923">The leave problem, because orders arrive in a</text><text x="45" y="329.6" font-size="14.5" font-weight="400" fill="#171923">system</text></g><text x="920" y="542" font-size="12.5" font-weight="700" fill="#5b5b67" text-anchor="end" opacity="0.75">ozzo.co.in</text></svg>
