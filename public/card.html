<style>
  :root{
    --violet:#7834E8; --violet2:#A657ED; --violet-hover:#681ED1;
    --ink:#0B0C16; --paper:#FBFAF6; --card:#FFFFFF;
    --fg:#171923; --muted:#5B5B67; --border:#E9E8E3; --soft:#F1F0EB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(120,52,232,.10), transparent 60%),
      var(--paper);
    color:var(--fg);
    min-height:100dvh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:22px 14px 40px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .card{
    width:100%; max-width:440px; background:var(--card);
    border:1px solid var(--border); border-radius:28px; overflow:hidden;
    box-shadow:0 30px 60px -24px rgba(11,12,22,.28), 0 2px 6px rgba(11,12,22,.04);
  }
  .cover{display:block; width:100%; height:auto; aspect-ratio:1024/500; object-fit:cover; background:var(--ink)}
  .head{padding:0 24px 6px; position:relative}
  .avatar{
    width:122px; height:122px; border-radius:50%; margin-top:-44px;
    border:5px solid var(--card); background:linear-gradient(135deg,var(--violet),var(--violet2));
    box-shadow:0 12px 24px -10px rgba(120,52,232,.55);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    position:relative; z-index:2;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block}
  .avatar .initials{color:#fff; font-weight:800; font-size:44px; letter-spacing:.5px}
  .name{font-size:30px; font-weight:800; letter-spacing:-.02em; margin:16px 0 2px}
  .role{font-size:16px; color:var(--muted); font-weight:500; margin:0}
  .org{font-size:17px; font-weight:700; margin:2px 0 0}
  .rows{padding:18px 16px 6px; display:flex; flex-direction:column; gap:6px}
  .row{
    display:flex; align-items:center; gap:16px; padding:11px 10px; border-radius:16px;
    text-decoration:none; color:var(--fg); transition:background .15s ease, transform .05s ease;
  }
  .row:hover{background:var(--soft)}
  .row:active{transform:scale(.99)}
  .ic{
    flex:0 0 auto; width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--violet),var(--violet2));
    box-shadow:0 8px 18px -8px rgba(120,52,232,.6);
  }
  .ic svg{width:22px; height:22px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .ic.wa{background:linear-gradient(135deg,#25D366,#12b856)} .ic.wa svg{fill:#fff; stroke:none}
  .ic.fb{background:linear-gradient(135deg,#1877F2,#0a5edc)} .ic.fb svg{fill:#fff; stroke:none}
  .rtext{display:flex; flex-direction:column; min-width:0}
  .rlabel{font-size:16px; font-weight:600; line-height:1.25}
  .rsub{font-size:12.5px; color:var(--muted); line-height:1.3; margin-top:1px}
  .cta{padding:8px 20px 22px}
  .save{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(100deg,var(--violet),var(--violet2));
    color:#fff; font-family:inherit; font-size:17px; font-weight:700; letter-spacing:.2px;
    text-decoration:none; box-shadow:0 14px 26px -10px rgba(120,52,232,.6);
    transition:transform .06s ease, filter .15s ease;
  }
  .save:hover{filter:brightness(1.05)} .save:active{transform:translateY(1px)}
  .save svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .foot{text-align:center; padding:2px 20px 10px}
  .foot a{color:var(--violet); text-decoration:none; font-weight:600}
  .foot small{color:var(--muted); font-size:12px}
</style>
