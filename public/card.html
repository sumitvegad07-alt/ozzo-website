<style>
  :root{
    --violet:#7834E8; --violet2:#A657ED;
    --ink:#0B0C16; --paper:#FBFAF6; --card:#FFFFFF;
    --fg:#171923; --muted:#5B5B67; --border:#E9E8E3; --soft:#F1F0EB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 60% at 50% 0%, rgba(120,52,232,.10), transparent 60%), var(--paper);
    color:var(--fg); min-height:100dvh; display:flex; align-items:flex-start; justify-content:center;
    padding:22px 14px 40px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .card{width:100%; max-width:440px; background:var(--card); border:1px solid var(--border);
    border-radius:28px; overflow:hidden; box-shadow:0 30px 60px -24px rgba(11,12,22,.28), 0 2px 6px rgba(11,12,22,.04);}
  .cover{display:block; width:100%; height:auto; aspect-ratio:1024/500; object-fit:cover; background:var(--ink)}
  .head{padding:0 24px 6px; position:relative}
  .avatar{width:122px; height:122px; border-radius:50%; margin-top:-44px; border:5px solid var(--card);
    background:linear-gradient(135deg,var(--violet),var(--violet2)); box-shadow:0 12px 24px -10px rgba(120,52,232,.55);
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; z-index:2;}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block}
  .avatar .initials{color:#fff; font-weight:800; font-size:44px; letter-spacing:.5px}
  .name{font-size:30px; font-weight:800; letter-spacing:-.02em; margin:16px 0 2px}
  .role{font-size:16px; color:var(--muted); font-weight:500; margin:0}
  .org{font-size:17px; font-weight:700; margin:2px 0 0}
  .rows{padding:18px 16px 6px; display:flex; flex-direction:column; gap:6px}
  .row{display:flex; align-items:center; gap:16px; padding:11px 10px; border-radius:16px;
    text-decoration:none; color:var(--fg); transition:background .15s ease, transform .05s ease;}
  .row:hover{background:var(--soft)} .row:active{transform:scale(.99)}
  .ic{flex:0 0 auto; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--violet),var(--violet2)); box-shadow:0 8px 18px -8px rgba(120,52,232,.6);}
  .ic svg{width:22px; height:22px}
  .rtext{display:flex; flex-direction:column; min-width:0}
  .rlabel{font-size:16px; font-weight:600; line-height:1.25}
  .rsub{font-size:12.5px; color:var(--muted); line-height:1.3; margin-top:1px}
  .cta{padding:8px 20px 22px}
  .save{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px;
    border-radius:999px; border:none; cursor:pointer; background:linear-gradient(100deg,var(--violet),var(--violet2));
    color:#fff; font-family:inherit; font-size:17px; font-weight:700; letter-spacing:.2px; text-decoration:none;
    box-shadow:0 14px 26px -10px rgba(120,52,232,.6); transition:transform .06s ease, filter .15s ease;}
  .save:hover{filter:brightness(1.05)} .save:active{transform:translateY(1px)}
  .save svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .foot{text-align:center; padding:2px 20px 12px}
  .foot a{color:var(--violet); text-decoration:none; font-weight:600}
  .foot small{color:var(--muted); font-size:12px}

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderCard(C, root){
  root = root || document;
  const av = root.getElementById("avatar");
  if (C.photo) av.innerHTML = '<img src="'+esc(C.photo)+'" alt="'+esc(C.name)+'">';
  else av.innerHTML = '<span class="initials">'+esc(C.initials||(C.name||"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase())+'</span>';
  root.getElementById("name").textContent = C.name || "";
  root.getElementById("role").textContent = C.role || "";
  root.getElementById("org").textContent  = C.org  || "";
  const rows = root.getElementById("rows"); rows.innerHTML = "";
  (C.links||[]).forEach(l=>{
    const t = TYPES[l.type]; if(!t) return;
    if(!l.on) return;
    if(!l.value) return;
    const href = t.href(l.value);
    const ext = !/^(mailto:|tel:)/.test(href);
    const a = document.createElement("a");
    a.className="row"; a.href=href; if(ext){a.target="_blank"; a.rel="noopener";}
    a.innerHTML = '<span class="ic" style="background:'+t.color+'">'+t.svg+'</span>'+
      '<span class="rtext"><span class="rlabel">'+esc(l.label)+'</span>'+
      (l.sub?'<span class="rsub">'+esc(l.sub)+'</span>':'')+'</span>';
    rows.appendChild(a);
  });
}

function buildVCF(C){
  const parts = (C.name||"").trim().split(/\s+/);
  const last = parts.length>1 ? parts.pop() : "";
  const first = parts.join(" ");
  const L = ["BEGIN:VCARD","VERSION:3.0","N:"+last+";"+first+";;;","FN:"+(C.name||""),"ORG:"+(C.org||""),"TITLE:"+(C.role||"")];
  (C.links||[]).forEach(l=>{
    if(!l.on||!l.value) return;
    if(l.type==="email") L.push("EMAIL;TYPE=WORK:"+l.value);
    else if(l.type==="phone") L.push("TEL;TYPE=CELL,VOICE:"+l.value);
    else if(l.type==="whatsapp") L.push("URL:https://wa.me/"+l.value.replace(/\D/g,""));
    else L.push("URL:"+TYPES[l.type].href(l.value));
  });
  if(C.tagline) L.push("NOTE:"+C.tagline);
  L.push("END:VCARD");
  return L.join("\r\n");
}

if (typeof document !== "undefined" && document.getElementById("avatar")) {
  renderCard(CARD);
  const save = document.getElementById("save");
  if (save) save.addEventListener("click", function(e){
    e.preventDefault();
    const blob = new Blob([buildVCF(CARD)], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (CARD.name||"contact").replace(/\s+/g,"-")+".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  });
}
</script>
